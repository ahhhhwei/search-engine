name: Build and deploy official Ruan Yifeng weekly search

on:
  push:
    branches: [master]
    paths:
      - "wasm/**"
      - "web/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout search engine
        uses: actions/checkout@v6

      - name: Checkout official Ruan Yifeng weekly corpus
        id: official-corpus
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ruanyf/weekly
          ref: 07fea239b574fa2677bdb60696eb117184bd9b0d
          path: .corpus/weekly
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build deterministic search corpus
        run: |
          if [[ -d .corpus/weekly/docs ]]; then
            if python scripts/build_weekly_corpus.py \
              --source .corpus/weekly/docs \
              --output web/data/documents.json \
              --source-revision 07fea239b574fa2677bdb60696eb117184bd9b0d \
              --max-content-chars 15000 \
              --min-documents 300; then
              echo "Generated the full official Markdown corpus."
            else
              echo "::warning title=Corpus generation fallback::Using the committed official-title snapshot."
            fi
          else
            echo "::warning title=Official corpus checkout fallback::Using the committed official-title snapshot."
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("web/data/documents.json")
          documents = json.loads(path.read_text(encoding="utf-8"))
          assert len(documents) >= 20, len(documents)
          assert all(item["title"].strip() and item["content"].strip() for item in documents)
          assert all(
              item["url"].startswith("https://github.com/ruanyf/weekly/")
              for item in documents
          )
          mode = "full official Markdown corpus" if len(documents) >= 300 else "official fallback snapshot"
          print(f"validated {len(documents)} documents ({mode})")
          PY

      - name: Run native C++ smoke test
        run: ./scripts/test_native.sh

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest

      - name: Compile C++ to WebAssembly
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build_wasm.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
