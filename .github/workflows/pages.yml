name: Build and deploy Ruan Yifeng blog search

on:
  push:
    branches: [master]
    paths:
      - "wasm/**"
      - "web/**"
      - "scripts/**"
      - "Crawler/requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Crawler/requirements.txt

      - name: Install crawler dependencies
        run: python -m pip install -r Crawler/requirements.txt

      - name: Crawl Ruan Yifeng blog corpus
        run: |
          python scripts/crawl_ruanyifeng.py \
            --output web/data/documents.json \
            --max-pages 1000 \
            --max-content-chars 10000 \
            --delay 0.10
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("web/data/documents.json")
          documents = json.loads(path.read_text(encoding="utf-8"))
          assert len(documents) >= 20, len(documents)
          assert all(item["url"].startswith("https://www.ruanyifeng.com/blog/") for item in documents)
          print(f"validated {len(documents)} Ruan Yifeng blog documents")
          PY

      - name: Run native C++ smoke test
        run: ./scripts/test_native.sh

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install latest
          "$RUNNER_TEMP/emsdk/emsdk" activate latest

      - name: Compile C++ to WebAssembly
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build_wasm.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
